<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CC Multicolor Website(Exercise 4 Solution)</title>
    <style>
        <!-- :root{
            --primary-color:rgb(37, 106, 234);
            --text-color:white;
            --secondary-color:rgb(102, 152, 245);
        } -->

        :root{
            --primary-color:rgb(228, 94, 163);
            --text-color:white;
            --secondary-color:rgb(245, 170, 209);
        }

        body{
            background-color: var(--secondary-color);
        }

        *{
            margin: 0;
            padding: 0;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }

        nav{
            background-color: var(--primary-color);
            padding: 12px 0;
        }

        ul li{
            list-style: none;
            display: inline;
            padding: 23px;
            font-weight: bolder;
        }

        ul li a{
            color: var(--text-color);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/">About</a></li>
                <li><a href="/">Services</a></li>
                <li><a href="/">Contact Us</a></li>
            </ul>
        </nav>
    </header>
</body>
</html>
