<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 8 - Bounce Animation</title>
    <style>
        .container {
            position: relative;
            height: 80vh;
            width: 80vw;
            background-color: blue;
        }

        .box {
            height: 121px;
            width: 121px;
            background-color: red;
            border-radius: 70px;
            position: absolute;
            bottom: 0;
            left: 0;
            animation: up 3s ease-out 1 ,
            down 3s ease-in 3s 1 ,
            upa 3s ease-in 6s 1 ,
            downa 3s ease-in 9s 1 ;

        }

        @keyframes up {
            0%{
                transform: translate(0vh, 0vh);
            }
            100%{
                transform: translate(40vh, -40vh);
            }
        }

        @keyframes down {
            0%{
                transform: translate(40vh, -40vh);
            }
            100%{
                transform: translate(80vh, 0vh);
            }
        }

        @keyframes upa {
            0%{
                transform: translate(80vh, 0vh);
            }
            100%{
                transform: translate(120vh, -40vh);
            }
        }

        @keyframes downa {
            0%{
                transform: translate(120vh, -40vh);
            }
            100%{
                transform: translate(160vh, 0vh);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">

        </div>
    </div>
</body>

</html>
