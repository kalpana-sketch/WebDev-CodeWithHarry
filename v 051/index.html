<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 8: Solution</title>
    <style>
        .box{
            height: 121px;
            width: 121px;
            background-color: red;
            border-radius: 70px;
            position: absolute;
            bottom: 0;
            left: 0;
            animation: animateX 5s linear 2s infinite, animateY 1s ease-out 2s infinite alternate;
        }

        .box img{
            height: 121px;
            width: 121px;
            border-radius: 50%;
            object-fit: cover;
        }

        .container{
            position: relative;
            height: 80vh;
            width: 80vw;
            background-color: blue;
        }

        @keyframes animateX {
            from{
                left: 0;
            }
            to{
                left: 100%;
            }            
        }

        @keyframes animateY {
            from{
                bottom: 0;
            }
            to{
                bottom: 100%;
            }            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <img src="hariompal.jpg" alt="">
        </div>
    </div>
</body>
</html>
